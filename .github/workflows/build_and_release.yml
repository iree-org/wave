name: Build and release packages

on:
  push:
    tags:
      - "v*" # tagged (stable) builds
  workflow_dispatch:
    inputs:
      channel:
        description: "Force channel (default auto-detect from ref)"
        required: false
        type: choice
        options: [nightly, stable]
      dry_run:
        description: "Build only (skip releases)"
        required: false
        type: boolean
        default: true
  schedule:
    # Runs at 05:00 AM UTC, which is 9:00 PM PST (UTC-8) / 10:00 PM PDT (UTC-7)
    # This lines up with https://github.com/iree-org/iree/blob/main/.github/workflows/schedule_candidate_release.yml
    # Downstream projects using nightly releases should expect IREE and
    # wave packages to all be available around the same time. This
    # build is much faster than the IREE build though.
    - cron: '0 5 * * *'

jobs:
  build_packages:
    if: ${{ github.repository_owner == 'iree-org' || github.event_name != 'schedule' }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    env:
      OUTPUT_DIR: "${{ github.workspace }}/bindist"

      # Auto-select channel:
      # - tag v*, it is stable
      # - else it is nightly
      IREE_CHANNEL: ${{ github.event.inputs.channel != '' && github.event.inputs.channel
                      || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && 'stable' || 'nightly') }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux packages
          - runs-on: ubuntu-24.04
            package: wave-lang
            python-version: cp310
            platform: manylinux_x86_64
          - runs-on: ubuntu-24.04
            package: wave-lang
            python-version: cp311
            platform: manylinux_x86_64
          - runs-on: ubuntu-24.04
            package: wave-lang
            python-version: cp312
            platform: manylinux_x86_64
          - runs-on: ubuntu-24.04
            package: wave-lang
            python-version: cp313
            platform: manylinux_x86_64

          # Windows packages.
          - runs-on: windows-2025
            package: wave-lang
            python-version: cp310
            platform: win_amd64
          - runs-on: windows-2025
            package: wave-lang
            python-version: cp311
            platform: win_amd64
          - runs-on: windows-2025
            package: wave-lang
            python-version: cp312
            platform: win_amd64
          - runs-on: windows-2025
            package: wave-lang
            python-version: cp313
            platform: win_amd64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: decide
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.channel }}" ]; then
            channel="${{ github.event.inputs.channel }}"
          elif [ "${{ github.ref_type }}" = "tag" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            channel="stable"
            is_stable=1
          else
            channel="nightly"
            is_stable=0
          fi

          echo "channel=$channel"   >> "$GITHUB_OUTPUT"
          echo "is_stable=$is_stable" >> "$GITHUB_OUTPUT"

      - name: Print channel selection
        run: |
          echo "ref_type=${{ github.ref_type }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "IREE_CHANNEL=${{ steps.decide.outputs.channel }}"
          echo "WAVE_IS_STABLE_REL=${{ steps.decide.outputs.is_stable }}"

      - name: Build wheels
        uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.python-version }}-${{ matrix.platform }}
          CIBW_BEFORE_ALL_LINUX: curl -sSf https://sh.rustup.rs | sh -s -- -y

          CIBW_ENVIRONMENT_LINUX: 'PATH=$HOME/.cargo/bin:$PATH IREE_CHANNEL=${{ steps.decide.outputs.channel }} WAVE_IS_STABLE_REL=${{ steps.decide.outputs.is_stable }}'
          CIBW_ENVIRONMENT: 'IREE_CHANNEL=${{ steps.decide.outputs.channel }} WAVE_IS_STABLE_REL=${{ steps.decide.outputs.is_stable }}'
          CIBW_ENVIRONMENT_WINDOWS: 'IREE_CHANNEL=${{ steps.decide.outputs.channel }} WAVE_IS_STABLE_REL=${{ steps.decide.outputs.is_stable }}'

          # Install the right IREE deps *inside each isolated build env* before building.
          CIBW_BEFORE_BUILD: |
            set -euxo pipefail
            echo "IREE_CHANNEL=${IREE_CHANNEL}"
            echo "WAVE_IS_STABLE_REL=${WAVE_IS_STABLE_REL}"
            python -m pip install -U pip
            if [ "${WAVE_IS_STABLE_REL}" -eq 0 ]; then
              python -m pip install -r requirements-iree-pinned.txt
            fi

          CIBW_BEFORE_BUILD_WINDOWS: |
            echo IREE_CHANNEL=%IREE_CHANNEL%
            echo WAVE_IS_STABLE_REL=%WAVE_IS_STABLE_REL%
            python -m pip install -U pip
            if "%WAVE_IS_STABLE_REL%"=="0" (
              python -m pip install -r requirements-iree-pinned.txt
            )

      - name: Upload python wheels
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          if-no-files-found: error
          name: snapshot-${{ matrix.package }}-${{ matrix.python-version }}-${{ matrix.platform }}
          path: ./wheelhouse/*.whl

  # Rolling dev release
  release_dev:
    needs: build_packages
    if: ${{ success() && (github.repository_owner == 'iree-org' || github.event_name != 'schedule') && !(github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) && (github.event.inputs.dry_run != 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Create/update a release
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: snapshot-*
          # Merge all artifacts into a single directory
          merge-multiple: true
          path: dist

      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          project_id: 'oss-exit-gate-prod'
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Clean up stale releases from staging repo
        run: |
          packages=$(gcloud artifacts packages list \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="wave--githubreleases" \
              --format="value(name)" 2>/dev/null)
          echo "${packages}" | xargs -r -I {} sh -c '
              package_name=$(basename "{}")
              echo "Deleting package: $package_name..."
              gcloud artifacts packages delete "{}" \
                  --project="oss-exit-gate-prod" \
                  --location="us" \
                  --repository="wave--githubreleases" \
                  --quiet
          '

      - name: Stage release artifacts to OSS Exit Gate and upload manifest
        env:
          TAG_NAME: "dev-wheels"
          RELEASE_TITLE: "dev-wheels"
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          VERSION="${TAG_NAME#v}"
          for f in dist/*.whl; do
            [ -e "$f" ] || continue
            gcloud artifacts generic upload \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="wave--githubreleases" \
              --package="wave" \
              --version="${VERSION}" \
              --source="$f"
          done
          cat <<EOF > manifest.json
          {
            "packages": [
              {
                "name": "wave",
                "version": "${VERSION}",
                "release_title": "${RELEASE_TITLE}"
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/wave/githubreleases/manifests/manifest-${VERSION}-${RUN_ID}-${RUN_ATTEMPT}.json"

  # Tagged/stable release
  release_tag:
    needs: build_packages
    if: ${{ success() && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && (github.event.inputs.dry_run != 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: snapshot-*
          merge-multiple: true
          path: dist

      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          project_id: 'oss-exit-gate-prod'
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Clean up stale releases from staging repo
        run: |
          packages=$(gcloud artifacts packages list \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="wave--githubreleases" \
              --format="value(name)" 2>/dev/null)
          echo "${packages}" | xargs -r -I {} sh -c '
              package_name=$(basename "{}")
              echo "Deleting package: $package_name..."
              gcloud artifacts packages delete "{}" \
                  --project="oss-exit-gate-prod" \
                  --location="us" \
                  --repository="wave--githubreleases" \
                  --quiet
          '

      - name: Stage release artifacts to OSS Exit Gate and upload manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_TITLE: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          VERSION="${TAG_NAME#v}"
          for f in dist/*.whl; do
            [ -e "$f" ] || continue
            gcloud artifacts generic upload \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="wave--githubreleases" \
              --package="wave" \
              --version="${VERSION}" \
              --source="$f"
          done
          cat <<EOF > manifest.json
          {
            "packages": [
              {
                "name": "wave",
                "version": "${VERSION}",
                "release_title": "${RELEASE_TITLE}"
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/wave/githubreleases/manifests/manifest-${VERSION}-${RUN_ID}-${RUN_ATTEMPT}.json"
